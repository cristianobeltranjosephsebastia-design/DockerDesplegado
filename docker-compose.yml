services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80" #HTTP
      - "81:81" #Adminsitracion de la api
      - "443:443" #HTTPS
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - app-backend
    networks:
      - red-sebas

  servidor-bd:
    image: sebastian1101/mi-api:latest
    container_name: servidor-bd
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "adso_db"
    networks:
      - red-sebas

  app-backend:
    build: ./backend
    container_name: app-backend
    restart: always
    ports:
      - "5050:5050"
    depends_on:
      - servidor-bd
    networks:
      - red-sebas

networks:
  red-sebas:
    driver: bridge