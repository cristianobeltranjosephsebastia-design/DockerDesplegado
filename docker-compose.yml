services:
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
      -"80:80"
    volumes:
      -./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-backend
    networks:
      - red-sebas
  
  servidor-bd:
    image: postgres:15-alpine
    container_name: servidor-bd
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - datos_db:/var/lib/postgresql/data
    networks:
      - red-sebas

  # Backend / API
  backend:
    build: ./backend
    container_name: app-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=servidor-bd
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - servidor-bd
    networks:
      - red-sebas

  # Frontend
  app-web:
    build: ./frontend
    container_name: app-web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - red-sebas