name: Publicar Imagen en Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  #Ejecutar pruebas
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r ./backend/requirements.txt
          pip install pytest bandit

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101  #Ignorar los archivos test

      - name: Ejecutar pruebas con pytest
        run: pytest
  
  
  #Contruir y desplegar
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          no-cache: true
          tags: sebastian1101/mi-api:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sebastian1101/mi-api:latest
          format: 'table'
          exit-code: '1' # Si encuentra falla rompe la ejecucion
          ignore-unfixed: true
          vuln-type: 'os, library'
          severity: 'CRITICAL, HIGH' # Son los que van a detener la ejecucion

      - name: Subir imagen a Docker Hub
        run: docker push sebastian1101/mi-api:latest
      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: | 
            cd ~/DockerDesplegado
            docker compose pull app-backend
            docker compose up -d
          